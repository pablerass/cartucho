[project]
name = "cartucho"
version = "0.1.0a1"
description = "A tool to cache function and method results"
readme = "README.md"
authors = [{ name = "Pablo Muñoz", email = "pablerass@gmail.com" }]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
keywords = ["cache", "function", "method", "decorator"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=4.0"]

[project.urls]
Homepage = "https://github.com/pablerass/cartucho"

[dependency-groups]
test = [
  "pytest",
  "coverage",
  "redis>=4.0",
  "fakeredis",
  "ty>=0.0.99",
  "ruff>=0.17.4",
]
dev = [
  "bumpver",
  "ipython",
  "ipdb",
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
]

[tool.uv]
# Install every group with a plain `uv sync`.
default-groups = ["test", "dev", "docs"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]

[tool.uv.build-backend]
# The package lives at the repository root, not under src/.
module-root = ""

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[pytest]
addopts = "--pdbcls=IPython.terminal.debugger:TerminalPdb"

[tool.coverage.run]
source = [
  "."
]
omit = [
  "conftest.py",
  "setup.py",
  "build/*",
  "dist/*",
  "docs/*",
  "tests/*",
  ".tox/*"
]

[tool.coverage.report]
fail_under = 80

[bumpver]
current_version = "v0.1.0a1"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[bumpver.file_patterns]
"cartucho/__init__.py" = [
    '^__version__ = "{version}"$',
]
