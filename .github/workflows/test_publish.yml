name: "Test and publish"

on:
  push:

jobs:
  test:
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    env:
      UV_PYTHON: "${{ matrix.python-version }}"

    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v7"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v10.3.3"
        with:
          enable-cache: true

      - name: "Install Dependencies"
        run: |
          uv sync --locked

      - name: "Lint"
        run: |
          make lint

      - name: "Type Check"
        run: |
          make type-check

      - name: "Test"
        run: |
          make test-coverage

      - name: "Docs"
        run: |
          make docs

  publish:
    runs-on: "ubuntu-latest"
    needs: "test"
    if: "startsWith(github.ref, 'refs/tags/v')"

    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v7"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v10.3.3"

      - name: "Build"
        run: |
          make build

      - name: "Publish to Pypi"
        run: |
          uv publish
        env:
          UV_PUBLISH_TOKEN: "${{ secrets.PYPI_API_TOKEN }}"

      - name: "Create Release"
        uses: "softprops/action-gh-release@v3"
        with:
          files: "dist/*"
          prerelease: true
