name: "Test and publish"

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v5"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v6"
        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Install Dependencies"
        run: |
          uv sync --locked

      - name: "Lint"
        run: make lint

      - name: "Type Check"
        run: make type-check

      - name: "Test"
        run: make test-coverage

  publish:
    runs-on: "ubuntu-latest"
    needs: "test"
    if: "startsWith(github.ref, 'refs/tags/v')"
    permissions:
      contents: write

    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v5"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v6"
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: "Build"
        run: make build

      - name: "Publish to Pypi"
        uses: "pypa/gh-action-pypi-publish@release/v1"
        with:
          password: "${{ secrets.PYPI_API_TOKEN }}"

      - name: "Create Release"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --prerelease
