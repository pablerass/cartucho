name: "Test and publish"

on:
  push:

jobs:
  test:
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v3"

      - name: "Prepare Python"
        uses: "actions/setup-python@v4"
        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Install Poetry"
        uses: "snok/install-poetry@v1"

      - name: "Install Dependencies"
        run: |
          poetry install

      - name: "Lint"
        run: |
          make lint

      - name: "Type Check"
        run: |
          make type-check

      - name: "Test"
        run: |
          make test-coverage

  publish:
    runs-on: "ubuntu-latest"
    needs: "test"
    if: "startsWith(github.ref, 'refs/tags/v')"

    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v3"

      - name: "Prepare Python"
        uses: "actions/setup-python@v4"

      - name: "Install Poetry"
        uses: "snok/install-poetry@v1"

      - name: "Build"
        run: |
          poetry install --with dev
          make build

      - name: "Publish to Pypi"
        uses: "pypa/gh-action-pypi-publish@release/v1"
        with:
          password: "${{ secrets.PYPI_API_TOKEN }}"

      - name: "Create Release"
        uses: "softprops/action-gh-release@v1"
        with:
          files: "dist/*"
          prerelease: True